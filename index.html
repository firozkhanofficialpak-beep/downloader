<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Download Free - Online Downloader</title>
    
    <!-- Yahan par aap apni Adsterra ka Popunder Script paste kar sakte hain -->
    <!-- <script type="text/javascript" src="//plxxyyzz.com/popunder.js"></script> -->

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
        }
        header {
            background-color: #ff0000;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #222;
        }
        p {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #ff0000;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #cc0000;
        }
        footer {
            text-align: center;
            padding: 15px;
            background-color: #222;
            color: #aaa;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <header>
        <h2>YT Downloader Hub</h2>
    </header>

    <div class="container">
        <h1>YouTube Video Download Free</h1>
        <p>Paste your YouTube video link below to process and get your download link instantly.</p>
        
        <!-- Form jo click hone par ya button dabane par user ko downloader site par le jayega -->
        <div class="input-group">
            <input type="text" id="yt-link" placeholder="Paste YouTube link here (e.g., https://youtu.be/...)">
            <button onclick="handleDownload()">Download</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 myatifww.github.io. All rights reserved.</p>
    </footer>

    <script>
        function handleDownload() {
            const linkInput = document.getElementById('yt-link').value.trim();
            if(linkInput === "") {
                alert("Please paste a valid YouTube link first!");
                return;
            }
            
            // Yahan par user vidssave.com par redirect ho jayega 
            // Aap chahein toh user ke link ko encode karke vidssave.com ke sath bhi attach kar sakte hain
            window.location.href = "https://vidssave.com/";
        }
    </script>

</body>
  </html>
